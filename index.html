<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>MapWarm — 걸어서 땅따먹기</title>
  <!-- ⚠ 캐시 버스팅 버전: 현재 v=026 — 릴리스마다 이 파일의 모든 ?v= 숫자를 함께 올릴 것
       (아래 css 2개 + body 하단 js 15개, 전부 동일한 값이어야 한다) -->
  <link rel="stylesheet" href="css/design-system.css?v=026">
  <link rel="stylesheet" href="css/main.css?v=026">
</head>
<body>
  <main class="game-area" id="game-area">
    <canvas id="game"></canvas>

    <div id="gps-badge" class="gps-badge hidden" role="status">GPS 정확도 낮음</div>

    <div class="map-attribution">© OpenStreetMap contributors</div>

    <div id="joystick" class="joystick hidden" aria-hidden="true">
      <div class="joystick-stick"></div>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>

    <!-- 판 종료(승리/시간종료/사망) 결과 = 동네 정복 카드 -->
    <div id="overlay" class="overlay hidden">
      <div class="overlay-card result-card">
        <span class="rivet rivet-tl" aria-hidden="true"></span>
        <span class="rivet rivet-tr" aria-hidden="true"></span>
        <span class="rivet rivet-bl" aria-hidden="true"></span>
        <span class="rivet rivet-br" aria-hidden="true"></span>
        <h2 id="result-title">사망!</h2>
        <p id="death-reason"></p>
        <canvas id="card-canvas" class="card-canvas" width="1080" height="1350"
                aria-label="동네 정복 카드"></canvas>
        <label class="card-map-toggle">
          <input type="checkbox" id="card-map-toggle">
          지도 배경 포함
        </label>
        <div class="result-actions">
          <button type="button" id="share-btn" class="btn-primary">자랑하기</button>
          <button type="button" id="restart-btn" class="btn-secondary">다시 시작</button>
        </div>
      </div>
    </div>
  </main>

  <!-- HUD: 지도 풀블리드 위에 떠 있는 스티커 칩 레이어 -->
  <header class="hud-layer">
    <div class="hud">
      <div class="chip chip-occupancy">
        <span class="chip-labels">
          <span class="chip-label-en">MY LAND</span>
          <span class="chip-label-ko">점유율</span>
        </span>
        <span class="led-fill"><span id="occupancy">0.0%</span></span>
      </div>
      <div class="chip chip-best">
        <svg class="star" viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true">
          <path d="M12 2.2l2.9 6.1 6.7.8-4.9 4.6 1.3 6.6L12 17.1l-6 3.2 1.3-6.6L2.4 9.1l6.7-.8z"/>
        </svg>
        BEST <span id="best">0.0%</span>
      </div>
      <div class="chip chip-time" id="chip-time" role="timer" aria-label="남은 시간">
        <span class="chip-time-label">TIME</span>
        <span id="round-time">3:00</span>
      </div>
    </div>
    <div class="hud-controls">
      <div class="chip mode-toggle" role="radiogroup" aria-label="조작 모드">
        <button type="button" class="mode-option active" data-mode="demo" role="radio" aria-checked="true">데모</button>
        <button type="button" class="mode-option" data-mode="gps" role="radio" aria-checked="false">GPS</button>
      </div>
      <div class="theme-toggle" role="radiogroup" aria-label="테마 선택">
        <button type="button" class="theme-toggle-option" data-theme="light" role="radio" aria-checked="false" aria-label="라이트 테마">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M5 5l1.6 1.6M17.4 17.4 19 19M19 5l-1.6 1.6M6.6 17.4 5 19"/>
          </svg>
        </button>
        <button type="button" class="theme-toggle-option" data-theme="dark" role="radio" aria-checked="false" aria-label="다크 테마">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.2 14.6A8.4 8.4 0 1 1 9.4 3.8a6.9 6.9 0 0 0 10.8 10.8z"/>
          </svg>
        </button>
        <button type="button" class="theme-toggle-option active" data-theme="system" role="radio" aria-checked="true" aria-label="시스템 테마">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4.5" width="18" height="12.5" rx="2"/>
            <path d="M9 21h6M12 17.5V21"/>
          </svg>
        </button>
      </div>
      <button type="button" id="mute-btn" class="mute-btn" aria-pressed="false" aria-label="소리 끄기">
        <svg class="ico-sound-on" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z"/>
          <path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
        </svg>
        <svg class="ico-sound-off" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z"/>
          <path d="M17 9.5l4 5M21 9.5l-4 5"/>
        </svg>
      </button>
      <button type="button" id="bgm-btn" class="mute-btn bgm-btn" aria-pressed="true" aria-label="음악 끄기">
        <svg class="ico-bgm-on" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 18V6l10-2v12"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="16" cy="16" r="3"/>
        </svg>
        <svg class="ico-bgm-off" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 18V6l10-2v6"/>
          <circle cx="6" cy="18" r="3"/>
          <path d="M3 3l18 18"/>
        </svg>
      </button>
      <button type="button" id="profile-btn" class="profile-btn" aria-label="프로필 설정">
        <canvas id="profile-thumb" class="profile-thumb" width="30" height="30" aria-hidden="true"></canvas>
      </button>
    </div>
  </header>

  <!-- 프로필 설정 시트 -->
  <div id="profile-overlay" class="overlay hidden">
    <div class="overlay-card profile-card">
      <span class="rivet rivet-tl" aria-hidden="true"></span>
      <span class="rivet rivet-tr" aria-hidden="true"></span>
      <span class="rivet rivet-bl" aria-hidden="true"></span>
      <span class="rivet rivet-br" aria-hidden="true"></span>
      <h2 id="profile-title">프로필</h2>

      <div class="profile-preview">
        <canvas id="profile-preview-canvas" width="96" height="96" aria-hidden="true"></canvas>
      </div>

      <label class="pf-field">
        <span class="pf-label">이름</span>
        <input type="text" id="pf-nick" class="pf-input" maxlength="10"
               placeholder="이름" autocomplete="off" spellcheck="false">
      </label>

      <div class="pf-field">
        <span class="pf-label">사진</span>
        <div class="pf-photo-row">
          <label class="pf-btn-file">
            사진 선택
            <input type="file" id="pf-photo" accept="image/*" hidden>
          </label>
          <button type="button" id="pf-photo-clear" class="pf-btn-clear">사진 지우기</button>
        </div>
      </div>

      <div class="pf-field">
        <span class="pf-label">기본 얼굴 <small>(사진 없을 때)</small></span>
        <div class="pf-faces" id="pf-faces" role="radiogroup" aria-label="기본 얼굴"></div>
      </div>

      <div class="pf-field">
        <span class="pf-label">색</span>
        <div class="pf-colors" id="pf-colors" role="radiogroup" aria-label="프로필 색"></div>
      </div>

      <div class="pf-field">
        <span class="pf-label">그룹 <small>(친구와 같은 동네)</small></span>
        <div class="pf-group-row">
          <input type="text" id="pf-group" class="pf-input" maxlength="6"
                 placeholder="코드 6자리" autocomplete="off" spellcheck="false"
                 style="text-transform:uppercase">
          <button type="button" id="pf-group-join" class="pf-btn-clear">참여</button>
        </div>
        <div class="pf-group-row">
          <button type="button" id="pf-group-make" class="pf-btn-file">새 그룹 만들기</button>
          <button type="button" id="pf-group-share" class="pf-btn-clear">링크 복사</button>
        </div>
        <p class="pf-group-status" id="pf-group-status"></p>
      </div>

      <p class="pf-privacy">사진은 이 브라우저에만 저장돼요. 색·이름·얼굴만 친구와 공유돼요.</p>

      <div class="result-actions">
        <button type="button" id="pf-save" class="btn-primary">저장</button>
        <button type="button" id="pf-close" class="btn-secondary">닫기</button>
      </div>
    </div>
  </div>

  <script src="js/config.js?v=026"></script>
  <script src="js/theme.js?v=026"></script>
  <script src="js/profile.js?v=026"></script>
  <script src="js/net.js?v=026"></script>
  <script src="js/round.js?v=026"></script>
  <script src="js/warmth.js?v=026"></script>
  <script src="js/grid.js?v=026"></script>
  <script src="js/entities.js?v=026"></script>
  <script src="js/input.js?v=026"></script>
  <script src="js/gps.js?v=026"></script>
  <script src="js/audio.js?v=026"></script>
  <script src="js/map.js?v=026"></script>
  <script src="js/render.js?v=026"></script>
  <script src="js/card.js?v=026"></script>
  <script src="js/main.js?v=026"></script>
</body>
</html>
